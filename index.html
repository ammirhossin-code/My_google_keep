<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" id="meta-theme-color">
    <title>مدیریت کارها</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #202124;
            --toolbar-bg: #ffffff;
            --item-bg: #f9f9f9;
        }
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e8eaed;
            --toolbar-bg: #121212;
            --item-bg: #1e1e1e;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; padding: 0; transition: 0.3s; }
        
        .toolbar { display: flex; gap: 10px; padding: 10px; background: var(--toolbar-bg); position: sticky; top: 0; z-index: 10; border-bottom: 0; }
        .toolbar button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; }
        
        #new-category { width: 90%; margin: 10px auto; display: block; padding: 10px; border-radius: 8px; border: 1px solid #ccc; background: var(--bg-color); color: var(--text-color); }
        
        .category { margin: 10px; border-radius: 12px; overflow: hidden; background: var(--item-bg); }
        .cat-header { padding: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .cat-content { padding: 10px; display: none; }
        .cat-content.show { display: block; }
        
        .task-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
        .task-checkbox { width: 20px; height: 20px; }
        .completed { text-decoration: line-through; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="undo()">↩️</button>
        <button onclick="redo()">↪️</button>
        <button onclick="toggleAll()">↕️</button>
        <button onclick="toggleTheme()">🌙</button>
    </div>

    <input type="text" id="new-category" placeholder="افزودن لیست جدید...">

    <div id="app"></div>

    <script>
        let data = JSON.parse(localStorage.getItem('todoData')) || [];
        let history = [JSON.stringify(data)];
        let historyIndex = 0;

        function save() {
            localStorage.setItem('todoData', JSON.stringify(data));
            history = history.slice(0, historyIndex + 1);
            history.push(JSON.stringify(data));
            historyIndex++;
            render();
        }

        function undo() { if(historyIndex > 0) { historyIndex--; data = JSON.parse(history[historyIndex]); localStorage.setItem('todoData', JSON.stringify(data)); render(); } }
        function redo() { if(historyIndex < history.length - 1) { historyIndex++; data = JSON.parse(history[historyIndex]); localStorage.setItem('todoData', JSON.stringify(data)); render(); } }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('meta-theme-color').content = isDark ? '#121212' : '#ffffff';
        }

        function toggleAll() {
            const contents = document.querySelectorAll('.cat-content');
            const shouldShow = contents[0]?.style.display !== 'block';
            contents.forEach(c => c.style.display = shouldShow ? 'block' : 'none');
        }

        document.getElementById('new-category').onkeydown = (e) => {
            if(e.key === 'Enter' && e.target.value) {
                data.push({ title: e.target.value, collapsed: true, tasks: [], color: `hsl(${Math.random() * 360}, 70%, 80%)` });
                e.target.value = '';
                save();
            }
        };

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            data.forEach((cat, catIdx) => {
                const div = document.createElement('div');
                div.className = 'category';
                div.style.borderRight = `5px solid ${cat.color}`;
                div.innerHTML = `
                    <div class="cat-header" onclick="toggleCat(${catIdx})">
                        ${cat.title} <span>${cat.collapsed ? '🔽' : '🔼'}</span>
                    </div>
                    <div class="cat-content ${cat.collapsed ? '' : 'show'}">
                        ${cat.tasks.map((t, tIdx) => `
                            <div class="task-item">
                                <input type="checkbox" class="task-checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${catIdx}, ${tIdx})">
                                <span class="${t.done ? 'completed' : ''}">${t.text}</span>
                            </div>
                        `).join('')}
                        <input type="text" placeholder="تسک جدید..." onkeydown="addTask(event, ${catIdx})">
                    </div>
                `;
                app.appendChild(div);
            });
        }

        function toggleCat(idx) { data[idx].collapsed = !data[idx].collapsed; render(); }
        function toggleTask(cIdx, tIdx) { data[cIdx].tasks[tIdx].done = !data[cIdx].tasks[tIdx].done; save(); }
        function addTask(e, idx) {
            if(e.key === 'Enter' && e.target.value) {
                data[idx].tasks.push({ text: e.target.value, done: false });
                e.target.value = '';
                save();
            }
        }

        render();
    </script>
</body>
</html>
